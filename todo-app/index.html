<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindu Wedding - To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎊 Wedding To-Do List</h1>
            <p>Plan your perfect Hindu wedding ceremony</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Add a new task..." class="task-input">
                <select id="categorySelect" class="category-select">
                    <option value="general">General</option>
                    <option value="ceremonies">Ceremonies</option>
                    <option value="decorations">Decorations</option>
                    <option value="food">Food</option>
                </select>
                <button id="addBtn" class="add-btn">Add Task</button>
            </div>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="ceremonies">Ceremonies</button>
            <button class="filter-btn" data-filter="decorations">Decorations</button>
            <button class="filter-btn" data-filter="food">Food</button>
        </div>

        <div id="taskList" class="task-list"></div>
        <button id="clearBtn" class="clear-btn">Clear Completed Tasks</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
